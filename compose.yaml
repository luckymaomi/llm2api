name: llm2api

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: llm2api-postgres
    environment:
      POSTGRES_DB: ${LLM2API_POSTGRES_DB:-llm2api}
      POSTGRES_USER: ${LLM2API_POSTGRES_USER:-llm2api}
      POSTGRES_PASSWORD: ${LLM2API_POSTGRES_PASSWORD:-llm2api_dev}
      TZ: ${LLM2API_TZ:-Asia/Shanghai}
    ports:
      - "${LLM2API_POSTGRES_BIND:-127.0.0.1}:${LLM2API_POSTGRES_PORT:-15432}:5432"
    volumes:
      - llm2api_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  valkey:
    image: valkey/valkey:9.1.0-alpine
    container_name: llm2api-valkey
    environment:
      VALKEY_PASSWORD: ${LLM2API_VALKEY_PASSWORD:-llm2api_dev}
      TZ: ${LLM2API_TZ:-Asia/Shanghai}
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${LLM2API_VALKEY_PASSWORD:-llm2api_dev}
    ports:
      - "${LLM2API_VALKEY_BIND:-127.0.0.1}:${LLM2API_VALKEY_PORT:-16380}:6379"
    volumes:
      - llm2api_valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  llm2api_postgres:
    name: llm2api_postgres
  llm2api_valkey:
    name: llm2api_valkey
